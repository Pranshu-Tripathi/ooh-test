[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ooh-test"
version = "0.1.0"
description = "Local-first repository understanding, testing, and judging loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17,<2.0",
  "fastapi>=0.116,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
ooh-api = "ooh.api.main:main"
ooh-worker = "ooh.worker.main:main"
ooh-migrate = "ooh.migrations:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ooh.api" = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
