apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: ooh-test
  labels:
    app.kubernetes.io/name: ooh-test
    app.kubernetes.io/instance: ooh-test
    app.kubernetes.io/part-of: ooh-test
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ooh-test
      app.kubernetes.io/instance: ooh-test
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ooh-test
        app.kubernetes.io/instance: ooh-test
        app.kubernetes.io/part-of: ooh-test
        app.kubernetes.io/component: scheduler
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      containers:
        - name: scheduler
          image: ooh-test:local
          imagePullPolicy: Never
          command:
            - python
            - -m
            - ooh.scheduler.main
          envFrom:
            - configMapRef:
                name: ooh-runtime
          env:
            - name: OOH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ooh-database
                  key: OOH_DATABASE_URL
          startupProbe:
            exec:
              command:
                - python
                - -m
                - ooh.scheduler.healthcheck
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - ooh.scheduler.healthcheck
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
