apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ingestion
  namespace: ooh-test
  labels:
    app.kubernetes.io/name: ooh-test
    app.kubernetes.io/instance: ooh-test
    app.kubernetes.io/part-of: ooh-test
    app.kubernetes.io/component: worker-ingestion
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 720
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ooh-test
      app.kubernetes.io/instance: ooh-test
      app.kubernetes.io/component: worker-ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ooh-test
        app.kubernetes.io/instance: ooh-test
        app.kubernetes.io/part-of: ooh-test
        app.kubernetes.io/component: worker-ingestion
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 660
      containers:
        - name: worker
          image: ooh-test:local
          imagePullPolicy: Never
          command:
            - python
            - -m
            - ooh.worker.main
          envFrom:
            - configMapRef:
                name: ooh-runtime
          env:
            - name: OOH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ooh-database
                  key: OOH_DATABASE_URL
            - name: OOH_WORKER_JOB_TYPES
              value: ingest_repository
          startupProbe:
            exec:
              command:
                - python
                - -m
                - ooh.worker.healthcheck
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - ooh.worker.healthcheck
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: ooh-cache
              mountPath: /ooh_cache
      volumes:
        - name: ooh-cache
          persistentVolumeClaim:
            claimName: ooh-cache
